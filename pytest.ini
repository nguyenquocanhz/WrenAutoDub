[pytest]
# Chạy: python -m pytest -q   (đứng ở gốc dự án)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Gốc dự án phải nằm trên sys.path thì `import wrenautodub` mới thấy.
# tests/conftest.py cũng tự chèn, giữ cả hai để chạy được từ mọi thư mục.
pythonpath = .

# -p no:cacheprovider: không ghi .pytest_cache vào gốc dự án cho sạch cây thư mục.
# Không đặt -q ở đây: người dùng tự thêm -q, đặt hai lần thì pytest im luôn cả
# dòng tổng kết.
addopts = --strict-markers -p no:cacheprovider

markers =
    bug: test phơi bày bug thật trong code (đang xfail) — xem báo cáo BUG-1..BUG-6
    cham: test chạy chậm hơn 1 giây (dùng tiến trình con)
