# Tắt nút "Open a blank issue". Hai mẫu bên cạnh hỏi đúng những thứ cần —
# issue trắng gần như luôn thiếu output doctor và định dạng file, rồi phải
# hỏi lại từ đầu.
#
# Disables the "Open a blank issue" button. The two templates ask for exactly
# what is needed — blank issues almost always omit the doctor output and the
# file format, which means another round trip.
blank_issues_enabled: false
